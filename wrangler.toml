name = "hendy-tools-platform"
main = "src/worker.ts"
compatibility_date = "2026-10-15"

# Cloudflare Workers static assets configuration
[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare Pages build output configuration
pages_build_output_dir = "./dist"

[site]
bucket = "./dist"

# Production environment variables
[vars]
ENVIRONMENT = "production"
APP_NAME = "Hendy Tools Platform"
RELEASE_STORAGE_BUCKET = "hendy-tool-releases"
