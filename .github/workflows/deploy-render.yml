name: Deploy to Render Web Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-render-production
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    name: Build & Trigger Render Web Service Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify build integrity
        run: npm run build

      - name: Trigger Render Web Service Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render Web Service deploy hook..."
          curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deployment triggered successfully!"
