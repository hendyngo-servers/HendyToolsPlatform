name: Manual deploy Hendy Worker and website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker and direct-download website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Type-check Worker
        run: npm run typecheck
      - name: Ensure R2 bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler r2 bucket list | grep -q 'hendy-tool-releases'; then
            npx wrangler r2 bucket create hendy-tool-releases
          fi
      - name: Deploy website and API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
