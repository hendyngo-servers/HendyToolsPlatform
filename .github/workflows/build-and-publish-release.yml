name: Build and publish Hendy release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 3.2.0'
        required: true
        type: string
      build:
        description: 'Increasing build number, for example 30200'
        required: true
        type: string
      notes:
        description: 'Release notes shown on the download website'
        required: true
        default: 'Sửa lỗi và cải thiện hiệu năng.'
        type: string
      min_supported_version:
        description: 'Minimum version supported before an update is marked mandatory, for example 3.1.0'
        required: true
        default: '1.0.0'
        type: string
      mandatory:
        description: 'Mark this release mandatory for clients older than the minimum version'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_BUILD: ${{ inputs.build }}
  RELEASE_NOTES: ${{ inputs.notes }}
  MIN_SUPPORTED_VERSION: ${{ inputs.min_supported_version }}
  RELEASE_MANDATORY: ${{ inputs.mandatory }}
  HENDY_UPDATE_BASE_URL: ${{ vars.HENDY_UPDATE_BASE_URL }}

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Validate and stamp version
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HENDY_UPDATE_BASE_URL)) { throw 'Set repository variable HENDY_UPDATE_BASE_URL to the deployed Worker URL first.' }
          python scripts/set_release_version.py --version $env:RELEASE_VERSION --build $env:RELEASE_BUILD --update-url $env:HENDY_UPDATE_BASE_URL
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name HendyToolsPro --collect-all customtkinter --collect-all googleapiclient --hidden-import google_auth_oauthlib.flow --hidden-import google.auth.transport.requests hendy_tools_pro.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler missing: $iscc" }
          & $iscc 'installer\HendyTools.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "installer\Output\HendyToolsPro-$env:RELEASE_VERSION-Setup.exe"
          if (!(Test-Path $installer)) { throw "Installer not found: $installer" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/Output/HendyToolsPro-${{ inputs.version }}-Setup.exe
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true
      - name: Validate release version and update URL
        shell: bash
        run: |
          if [[ -z "$HENDY_UPDATE_BASE_URL" || "$HENDY_UPDATE_BASE_URL" != https://* || "$HENDY_UPDATE_BASE_URL" == *example.workers.dev* ]]; then
            echo 'Set repository variable HENDY_UPDATE_BASE_URL to the deployed Worker URL first.' >&2; exit 1
          fi
          python scripts/set_release_version.py --version "$RELEASE_VERSION" --build "$RELEASE_BUILD" --update-url "$HENDY_UPDATE_BASE_URL" --python-file unused-windows-source.py --installer-file unused-installer.iss --pubspec-file mobile_app/pubspec.yaml
      - name: Generate Android/iOS native Flutter project
        shell: bash
        run: |
          mkdir -p build
          flutter create --platforms=android,ios --project-name=hendy_tools_mobile --org=com.hendytools build/mobile
          cp mobile_app/pubspec.yaml build/mobile/pubspec.yaml
          cp mobile_app/analysis_options.yaml build/mobile/analysis_options.yaml
          cp mobile_app/lib/main.dart build/mobile/lib/main.dart
          cd build/mobile
          flutter pub get
      - name: Configure stable Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          FLUTTER_PROJECT_DIR: build/mobile
        run: python scripts/configure_android_signing.py
      - name: Build signed Android APK
        shell: bash
        run: |
          cd build/mobile
          flutter build apk --release --dart-define="HENDY_UPDATE_BASE_URL=$HENDY_UPDATE_BASE_URL" --dart-define=HENDY_UPDATE_CHANNEL=stable
          mkdir -p ../../mobile-output
          cp build/app/outputs/flutter-apk/app-release.apk "../../mobile-output/HendyToolsMobile-${RELEASE_VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile-output/HendyToolsMobile-${{ inputs.version }}.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Upload packages to R2 and publish manifests
    runs-on: ubuntu-latest
    needs: [windows, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Wrangler
        run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-artifacts/android
      - name: Publish Windows release to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          ARGS=()
          if [[ "$RELEASE_MANDATORY" == "true" ]]; then ARGS+=(--mandatory); fi
          python scripts/publish_release.py --platform windows --version "$RELEASE_VERSION" --build "$RELEASE_BUILD" --file "release-artifacts/windows/HendyToolsPro-${RELEASE_VERSION}-Setup.exe" --min-supported-version "$MIN_SUPPORTED_VERSION" --notes "$RELEASE_NOTES" "${ARGS[@]}" --upload
      - name: Publish Android APK to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          ARGS=()
          if [[ "$RELEASE_MANDATORY" == "true" ]]; then ARGS+=(--mandatory); fi
          python scripts/publish_release.py --platform android --version "$RELEASE_VERSION" --build "$RELEASE_BUILD" --file "release-artifacts/android/HendyToolsMobile-${RELEASE_VERSION}.apk" --min-supported-version "$MIN_SUPPORTED_VERSION" --notes "$RELEASE_NOTES" "${ARGS[@]}" --upload
      - name: Show release URL
        run: |
          echo "Published Hendy Tools version $RELEASE_VERSION (build $RELEASE_BUILD)."
          echo "Open the Worker URL to see the updated direct-download website."
