  <!-- Single Page App URL restoration for GitHub Pages and Cloudflare subpath rewrites -->
  <script>
    (function(l) {
      if (l.search && l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      } else if (l.search && (l.search.indexOf('p=/') !== -1 || l.search.indexOf('?p=/') === 0)) {
        var match = l.search.match(/[?&]p=([^&]+)/);
        if (match) {
          var p = decodeURIComponent(match[1]);
          window.history.replaceState(null, null, p + (l.hash || ''));
        }
      }
    }(window.location));
  </script>
